<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Анализатор страниц{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="{{ url_for('index') }}">
            Анализатор страниц
          </a>
          <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('urls_index') }}">Сайты</a>
          </div>
        </div>
      </nav>
    </header>

    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ category }} mb-0" role="alert">
        {{ message }}
      </div>
    {% endfor %}

    <main class="flex-grow-1">
      {% block content %}{% endblock %}
    </main>

    <footer class="border-top py-3">
      <div class="container-fluid text-center">
        <a href="https://ru.hexlet.io/" target="_blank" rel="noopener noreferrer">
          Hexlet
        </a>
      </div>
    </footer>
  </body>
</html>
