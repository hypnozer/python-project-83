[project]
name = "hexlet-code"
version = "0.1.0"
description = "A Flask application for checking web pages for SEO suitability"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "flask>=3.1,<4.0",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
    "validators>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[project.scripts]
page-analyzer = "page_analyzer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["page_analyzer"]
